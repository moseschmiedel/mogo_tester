name: CI and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="dev"
          fi

          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output_dir="dist/mogo-tester_${version}_${GOOS}_${GOARCH}"
          binary_name="mogo-tester"
          if [[ "${GOOS}" == "windows" ]]; then
            binary_name="mogo-tester.exe"
          fi

          mkdir -p "${output_dir}"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o "${output_dir}/${binary_name}" \
            ./cmd/mogo-tester

          cp README.md "${output_dir}/README.md"

      - name: Package archive
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="dev"
          fi

          package_name="mogo-tester_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r "${package_name}.zip" "${package_name}"
          else
            tar -czf "${package_name}.tar.gz" "${package_name}"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: mogo-tester-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mogo-tester_*_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  publish-prefix:
    name: Publish prefix.dev package (${{ matrix.target-platform }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
          - os: macos-latest
            target-platform: osx-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          artifact-name: mogo-tester-conda-${{ matrix.target-platform }}
          recipe-path: recipe/recipe-mojo-community.yaml
          build-args: --target-platform ${{ matrix.target-platform }} --channel https://repo.prefix.dev/max-nightly --channel conda-forge

      - name: Upload package to prefix.dev
        shell: bash
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r pkg; do
            found=1
            echo "Uploading ${pkg}"
            rattler-build upload prefix --channel tree-d "${pkg}"
          done < <(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \))

          if [[ "${found}" -eq 0 ]]; then
            echo "No conda packages found in output"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
