name: CI and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true

      - name: Check formatting
        run: |
          pixi run format
          git diff --exit-code

      - name: Run tests
        run: pixi run test

  package-linux:
    name: Check linux-64 package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          artifact-name: conda-mogo-tester-linux-64-check
          recipe-path: recipe/recipe.yaml
          build-args: --target-platform linux-64 --channel https://conda.modular.com/max --channel conda-forge

      - name: Reject AVX-512 instructions
        shell: bash
        run: |
          set -euo pipefail

          pkg="$(find output/linux-64 -type f -name 'mogo-tester-*.conda' -print -quit)"
          test -n "${pkg}"
          check_dir="$(mktemp -d)"
          unzip -q "${pkg}" -d "${check_dir}"
          tar --zstd -xf "${check_dir}"/pkg-*.tar.zst -C "${check_dir}"

          # Keep each instruction on one line so its first bytes can be checked.
          disassembly="${check_dir}/disassembly.txt"
          objdump -d --insn-width=16 "${check_dir}/bin/mogo-tester" > "${disassembly}"

          # In 64-bit mode, 0x62 after any segment or address-size prefix is EVEX.
          read -r instruction_count evex_count < <(awk '
            /^[ \t]*[0-9a-f]+:[ \t]+[0-9a-f][0-9a-f] / {
              instructions++
              if (!/\(bad\)/ && /^[ \t]*[0-9a-f]+:[ \t]+((26|2e|36|3e|64|65|67) )*62 /) evex++
            }
            END { print instructions + 0, evex + 0 }
          ' "${disassembly}")

          if [[ "${instruction_count}" -eq 0 ]]; then
            echo "No instructions found in the package binary"
            exit 1
          fi
          if [[ "${evex_count}" -ne 0 ]]; then
            echo "Package uses EVEX encoding in ${evex_count} instructions"
            exit 1
          fi

  publish-prefix:
    name: Publish prefix.dev package (${{ matrix.target-platform }})
    runs-on: ${{ matrix.os }}
    needs: [test, package-linux]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
          - os: macos-latest
            target-platform: osx-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          artifact-name: conda-mogo-tester-${{ matrix.target-platform }}
          recipe-path: recipe/recipe-mojo-community.yaml
          build-args: --target-platform ${{ matrix.target-platform }} --channel https://conda.modular.com/max --channel conda-forge

      - name: Upload package to prefix.dev
        shell: bash
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r pkg; do
            found=1
            echo "Uploading ${pkg}"
            rattler-build upload prefix --channel tree-d "${pkg}"
          done < <(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \))

          if [[ "${found}" -eq 0 ]]; then
            echo "No conda packages found in output"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: publish-prefix
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}. Install with: pixi global install --channel https://prefix.dev/tree-d --channel https://conda.modular.com/max --channel conda-forge mogo-tester"
