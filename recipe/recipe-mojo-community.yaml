context:
  version: "3.1.0"

package:
  name: mogo-tester
  version: ${{ version }}

source:
  - git: https://github.com/moseschmiedel/mogo_tester
    tag: v${{ version }}

build:
  number: 0
  skip:
    - win
  script:
    # Link through the conda C compiler (absolute path); mojo otherwise looks
    # for `cc` on PATH.
    - export MODULAR_MOJO_MAX_LINKER_DRIVER="$(command -v "${CC:-cc}")"
    - mkdir -p "$PREFIX/bin"
    - >
      "$PREFIX/bin/mojo" build
      -I src
      -D MOGO_VERSION=v${{ version }}
      -o "$PREFIX/bin/mogo-tester"
      src/main.mojo

requirements:
  build:
    - ${{ compiler('c') }}
  host:
    # The compiler runs from the host prefix so the binary's rpath points at
    # the Mojo runtime (libKGENCompilerRTShared) that run requirements provide.
    - mojo-compiler ==1.2.0
    # libKGENCompilerRTShared needs libstdc++ at link time on Linux.
    - if: linux
      then: libstdcxx
  run:
    - mojo >=1.2.0,<1.3
    - mojo-compiler >=1.2.0,<1.3

tests:
  - script:
      - mogo-tester --version
      - mogo-tester --help
  - package_contents:
      bin:
        - mogo-tester

about:
  homepage: https://github.com/moseschmiedel/mogo_tester
  summary: Compile and run top-level Mojo test files.
  description: |
    mogo-tester discovers top-level Mojo files in a directory, compiles each
    one with mojo build, runs the produced binary, and prints per-file results
    plus a final summary.
  license: MIT
  license_file:
    - LICENSE
  repository: https://github.com/moseschmiedel/mogo_tester

extra:
  recipe-maintainers:
    - moseschmiedel
