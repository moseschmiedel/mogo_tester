name: CI and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true

      - name: Check formatting
        run: |
          pixi run format
          git diff --exit-code

      - name: Run tests
        run: pixi run test

  publish-prefix:
    name: Publish prefix.dev package (${{ matrix.target-platform }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
          - os: macos-latest
            target-platform: osx-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check recipe versions match tag
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          for recipe in recipe/recipe.yaml recipe/recipe-mojo-community.yaml; do
            recipe_version="$(sed -n 's/^  version: "\(.*\)"$/\1/p' "${recipe}" | head -n 1)"
            if [[ "${recipe_version}" != "${version}" ]]; then
              echo "${recipe} has version '${recipe_version}', expected '${version}'"
              exit 1
            fi
          done

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          artifact-name: conda-mogo-tester-${{ matrix.target-platform }}
          recipe-path: recipe/recipe-mojo-community.yaml
          build-args: --target-platform ${{ matrix.target-platform }} --channel https://conda.modular.com/max --channel conda-forge

      - name: Upload package to prefix.dev
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target-platform }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          found=0
          while IFS= read -r pkg; do
            found=1
            echo "Uploading ${pkg}"
            rattler-build upload prefix --channel tree-d "${pkg}"
          done < <(find "output/${TARGET_PLATFORM}" -maxdepth 1 -type f \( -name "mogo-tester-${version}-*.conda" -o -name "mogo-tester-${version}-*.tar.bz2" \))

          if [[ "${found}" -eq 0 ]]; then
            echo "No mogo-tester ${version} package found for ${TARGET_PLATFORM}"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: publish-prefix
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}. Install with: pixi global install --channel https://prefix.dev/tree-d --channel https://conda.modular.com/max --channel conda-forge mogo-tester"
